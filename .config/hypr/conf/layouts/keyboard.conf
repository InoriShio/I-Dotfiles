# Keyboard Layout
# https://wiki.hyprland.org/Configuring/Variables/#input

input {
    kb_layout = us
    kb_variant =
    kb_model =
    numlock_by_default = true
    follow_mouse = 1
    mouse_refocus=false
    accel_profile = flat
    sensitivity = 0
# ESC and CAPS swap
    kb_options = compose:ralt, #caps:swapescape
}    
