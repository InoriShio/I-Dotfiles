# ----------------------------------------------------- 
# General window decoration
# name: "Default"
# ----------------------------------------------------- 
general {
  border_size = 2
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = on
        ignore_opacity = true
        xray = false
        # blurls = waybar
    }
    active_opacity = 1.0
    inactive_opacity = 0.8
    fullscreen_opacity = 1.0


    shadow {
        enabled = true
        range = 30
        render_power = 3
        color = 0x66000000
    }

    #drop_shadow = true
    #shadow_range = 30
    #shadow_render_power = 13
    #col.shadow = 0x66000000
}
