# General window decoration
source = ~/.config/hypr/effects/colors/colors.conf

general {
    border_size = 4
    col.inactive_border = $vivian1 $ado 90deg
    col.active_border = $pink $vivian2 60deg
}

decoration {
    rounding = 10
    rounding_power = 2
    blur {
        enabled = true
        size = 2
        passes = 3
        new_optimizations = on
        ignore_opacity = true
        contrast = 1.0
        brightness = 1.0
        vibrancy = 0.0
        vibrancy_darkness = 0.0
        xray = false
        noise = 0
        popups = true
        input_methods = true
    }
    active_opacity = 1.0
    inactive_opacity = 1.0
    dim_inactive = true
    dim_strength = 0.0
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 100
        render_power = 4
        color = 0x66000000
        color_inactive = 0x33000000
        offset = 0, 10
        scale = 1
    }
}
